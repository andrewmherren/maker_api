; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_native

[test_base]
test_framework = unity
lib_ldf_mode = deep+
test_build_src = yes
build_flags = 
	-DUNITY_INCLUDE_CONFIG_H
	-DMAKER_API_STANDALONE_TEST
	-DWEB_PLATFORM_OPENAPI=1
	-DWEB_PLATFORM_MAKERAPI=1
	-DARDUINO_ARCH_ESP32
	-std=gnu++17
extra_scripts = scripts/inject_version_define.py
lib_deps =
	https://github.com/andrewmherren/web_platform_interface.git#c81f94625bd560506951778d7b770a7c158b33e8
	bblanchon/ArduinoJson@^7.0.0

[env:test_native]
extends = test_base
platform = native
build_unflags = -std=gnu++11
build_flags =
	${test_base.build_flags}
	-DNATIVE_PLATFORM
	-g
	-O0
	--coverage
	-fprofile-arcs
	-ftest-coverage
	-lgcov
	-DARDUINOFAKE_ENABLE_WIFI
	-DARDUINOFAKE_ENABLE_SERIAL
	-DARDUINOFAKE_ENABLE_STRING
	-fno-inline
    -fno-inline-small-functions
    -fno-default-inline
; ArduinoFake is native-testing-only (mocks Arduino.h; its fakeit.hpp needs
; RTTI, which ESP32 builds disable by default for code size) - scoped here,
; not in test_base, so it never leaks into test_esp32's build.
lib_deps =
	${test_base.lib_deps}
	https://github.com/FabioBatSilva/ArduinoFake.git
build_src_filter =
    +<../test/native/src/**>
    +<*>
	-<main.cpp>
test_filter = *
check_tool = cppcheck
check_flags = cppcheck: --enable=all --std=c++17

[env:test_esp32]
extends = test_base
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Regenerates assets/*.h from assets/src/*.{html,css,js} - the actual
; generator lives in web_platform (scripts/generate_web_assets.py) so it
; isn't duplicated across every repo that has assets; this just runs the
; copy PlatformIO fetches alongside the web_platform lib_dep below. Only
; wired into this env, not test_base/test_native, since that's the only
; one that depends on web_platform.
extra_scripts =
	${test_base.extra_scripts}
	.pio/libdeps/test_esp32/web_platform/scripts/generate_web_assets.py
; arduino-esp32 3.x's WiFi library (pulled in transitively via WebServer,
; used by web_platform_interface's route/response types) needs Networking's
; Network.h, but PlatformIO's deep+/chain+ LDF modes (inherited from
; test_base) fail to resolve it - see
; https://github.com/espressif/arduino-esp32/issues/9782. Plain deep works
; around it; test_native is unaffected.
lib_ldf_mode = deep
build_flags =
	${test_base.build_flags}
	-DESP_PLATFORM
	-O2
build_src_filter =
	+<*>
	-<main.cpp>
	+<../test/esp32/**/*.cpp>
test_filter = *
; maker_api depends only on web_platform_interface (types/abstract interfaces),
; not web_platform - but web_platform_interface's own concrete WebResponse/
; RouteVariant implementations are testing-only stand-ins (testing/*_native.cpp),
; not the real Arduino-mode ones maker_api.cpp actually calls
; (WebResponse::setProgmemContent etc.). Those real implementations live in
; web_platform, so pull it in here purely to make this test target link -
; matches usb_pd_controller/web_module_example's identical test_esp32 pattern,
; and PROJECT_PLAN.md's original dependency graph, which already called this
; out ("test_esp32 env pulls web_platform") but was never actually wired up.
lib_deps =
	${test_base.lib_deps}
	https://github.com/andrewmherren/web_platform.git#v0.4.0
; Prefer ESP-IDF's own bundled Unity over the registry ThrowTheSwitch/Unity
; package that `test_framework = unity` would otherwise auto-inject here -
; that package is header-inline and needs Serial visible at every unity.h
; include site, which caused spurious compile errors. Matches the same
; lib_ignore used by every other repo's test_esp32 env.
lib_ignore = Unity

[env:esp32-s3-devkitc-1]
extends = test_base
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
	-DESP_PLATFORM
	-DLIBRARY_COMPILE_ONLY
upload_protocol = none
